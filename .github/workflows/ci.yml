name: ci

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -race
      - name: CLI has no GUI deps
        run: |
          test -z "$(go list -deps ./cmd/mcmodlist | grep -E 'wails|fyne|qt' || true)"
          test -z "$(go list -deps ./engine | grep mcmodlist/ | grep -vE 'mcmodlist/(core|engine)' || true)"

  qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Qt 6
        # qt6-base-dev ships dev files + CMake configs for Widgets, Test, and
        # Concurrent (all part of qtbase); there are no separate -dev packages.
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - name: Build engine
        run: go build -o build/mcmodlist-engine ./cmd/mcmodlist-engine
      - name: Configure Qt
        run: cmake -S qtgui -B build/qtgui -DCMAKE_BUILD_TYPE=Release
      - name: Build Qt
        run: cmake --build build/qtgui -j
      - name: Qt tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          MCMODLIST_ENGINE: ${{ github.workspace }}/build/mcmodlist-engine
        run: ctest --test-dir build/qtgui --output-on-failure
      - name: Qt color grep (must be empty)
        run: |
          ! grep -RInE '#[0-9a-fA-F]{3,8}\b|QColor\(\s*[0-9]|QColor\(\s*"|Qt::(red|green|blue|black|white|gray|grey|yellow|cyan|magenta|dark|light)|QRgb|setStyleSheet\([^)]*(color|background)' qtgui/src
      - name: Qt model grep (must be empty)
        run: '! grep -RInE "QSortFilterProxyModel|std::sort" qtgui/src/model'

  release:
    # Publishes mcmodlist-release.tar.gz on a GitHub release. Runs only for
    # v* tags or manual dispatch; the release title carries the version.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [go, qt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        # Fixed top-level dir `mcmodlist/` — PKGBUILD cds into it. Asset name
        # is version-independent; the version lives in the release title.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="$(git describe --tags --always)"
          git archive --format=tar.gz --prefix=mcmodlist/ \
              --output=mcmodlist-release.tar.gz HEAD
          echo "MCMODLIST_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${MCMODLIST_RELEASE_VERSION}"
            git tag "$TAG" || true
            git push origin "$TAG" || true
          fi
          gh release create "$TAG" mcmodlist-release.tar.gz \
              --title "mcmodlist ${TAG#v}" \
              --generate-notes
